extends: base.yaml
output_dir: runs/cityscapes
dataset:
  root: "" # e.g. D:/datasets/cityscapes (containing leftImg8bit/ and gtFine/)
  classes: [road, sidewalk, building, wall, fence, pole, traffic_light, traffic_sign, vegetation, terrain, sky, person, rider, car, truck, bus, train, motorcycle, bicycle]
  colors: [[128,64,128], [244,35,232], [70,70,70], [102,102,156], [190,153,153], [153,153,153], [250,170,30], [220,220,0], [107,142,35], [152,251,152], [70,130,180], [220,20,60], [255,0,0], [0,0,142], [0,0,70], [0,60,100], [0,80,100], [0,0,230], [119,11,32]]
  label_map: {7: 0, 8: 1, 11: 2, 12: 3, 13: 4, 17: 5, 19: 6, 20: 7, 21: 8, 22: 9, 23: 10, 24: 11, 25: 12, 26: 13, 27: 14, 28: 15, 31: 16, 32: 17, 33: 18}
  splits:
    train:
      images: leftImg8bit/train/*/*_leftImg8bit.png
      image_base: leftImg8bit/train
      masks: gtFine/train/{parent}/{stem}_gtFine_labelIds.png
      strip_suffix: _leftImg8bit
    val:
      images: leftImg8bit/val/*/*_leftImg8bit.png
      image_base: leftImg8bit/val
      masks: gtFine/val/{parent}/{stem}_gtFine_labelIds.png
      strip_suffix: _leftImg8bit
    test:
      images: leftImg8bit/test/*/*_leftImg8bit.png
      image_base: leftImg8bit/test
      masks: null # Official test GT is withheld: prediction export only.
