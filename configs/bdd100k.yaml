extends: base.yaml
output_dir: runs/bdd100k
dataset:
  # Set to the absolute path of city_datasets/cl_datasets/bekerly on your server.
  root: ""
  classes: [road, sidewalk, building, wall, fence, pole, traffic_light, traffic_sign, vegetation, terrain, sky, person, rider, car, truck, bus, train, motorcycle, bicycle]
  colors: [[128,64,128], [244,35,232], [70,70,70], [102,102,156], [190,153,153], [153,153,153], [250,170,30], [220,220,0], [107,142,35], [152,251,152], [70,130,180], [220,20,60], [255,0,0], [0,0,142], [0,0,70], [0,60,100], [0,80,100], [0,0,230], [119,11,32]]
  ignore_index: 255
  label_map: {} # BDD100K train IDs 0..18; do not apply Cityscapes raw-ID mapping.
  rgb_label_map: {} # Use labels/, not the color_labels/ visualizations.
  splits:
    train:
      images: 10k/train/*.jpg
      image_base: 10k/train
      masks: labels/train/{stem}_train_id.png
    val:
      images: 10k/val/*.jpg
      image_base: 10k/val
      masks: labels/val/{stem}_train_id.png
    test:
      images: 10k/test/*.jpg
      image_base: 10k/test
      masks: null # No test labels in this layout; prediction export only.
